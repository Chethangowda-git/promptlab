services:
  postgres:
    image: postgres:16-alpine
    container_name: promptlab_postgres
    environment:
      POSTGRES_USER: promptlab
      POSTGRES_PASSWORD: promptlab_pass
      POSTGRES_DB: promptlab_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U promptlab -d promptlab_db"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: promptlab_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 5s

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: promptlab_server
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://promptlab:promptlab_pass@postgres:5432/promptlab_db
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkey_changeme}
      GROQ_API_KEY: ${GROQ_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      PORT: 4000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: on-failure

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: promptlab_client
    ports:
      - "80:80"
    depends_on:
      - server
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
