name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  server-lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
            token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: cd server && npm install

      - name: Generate Prisma client
        run: cd server && npx prisma generate

      - name: ESLint
        run: cd server && npm run lint

      - name: TypeScript check
        run: cd server && npx tsc --noEmit

  server-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: promptlab
          POSTGRES_PASSWORD: promptlab_pass
          POSTGRES_DB: promptlab_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U promptlab -d promptlab_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
        with:
           token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: cd server && npm install

      - name: Generate Prisma client
        run: cd server && npx prisma generate

      - name: Push test schema
        run: cd server && npx prisma db push
        env:
          DATABASE_URL: postgresql://promptlab:promptlab_pass@localhost:5432/promptlab_test

      - name: Run tests
        run: cd server && npm run test:ci
        env:
          DATABASE_URL: postgresql://promptlab:promptlab_pass@localhost:5432/promptlab_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: test_jwt_secret_for_ci
          GROQ_API_KEY: test_key
          GEMINI_API_KEY: test_key
          PORT: 4001

  client-build:
    name: Client Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
         token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: cd client && npm install

      - name: Build
        run: cd client && npm run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
            token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v5
        with:
          context: ./server
          push: false
          tags: promptlab-server:test

      - name: Build client image
        uses: docker/build-push-action@v5
        with:
          context: ./client
          push: false
          tags: promptlab-client:test